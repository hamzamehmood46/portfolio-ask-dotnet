<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ask my portfolio</title>
    <meta name="description" content="A grounded chatbot over a .NET portfolio. Every answer cites its source passages, and it says I don't know when the docs do not cover a question. Built with C# and Blazor WebAssembly." />
    <meta name="theme-color" content="#070912" />
    <meta name="color-scheme" content="dark" />
    <base href="/" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23070912'/%3E%3Cpath d='M16 18h32v22H30l-10 8v-8h-4z' fill='none' stroke='%237c9cff' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
        // ?embed=1 is used when the page sits inside another site; it only changes styling.
        if (/[?&]embed=1\b/.test(location.search)) { document.documentElement.classList.add('embed'); }
        window.askScroll = function () {
            var log = document.querySelector('.log');
            if (!log) { return; }
            var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            log.scrollTo({ top: log.scrollHeight, behavior: calm ? 'auto' : 'smooth' });
        };
    </script>
</head>

<body>
    <div id="app"><p class="boot" role="status">Opening the portfolio&hellip;</p></div>

    <div id="blazor-error-ui">
        Something went wrong. <a href="" class="reload">Reload</a>
        <span class="dismiss">&#x2715;</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
